name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  binario:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar sintaxis
        run: python -m py_compile tools/*.py

      - name: Validar data/bible.dat
        run: python tools/sim_esp32.py --selftest
